<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>日历同步失败</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        button, input, select, textarea, a {
            -webkit-app-region: no-drag !important;
            pointer-events: auto;
        }

        :root {
            --radius: 28px;
            /* 与主面板 / 设置页完全一致的材质，保证三个窗口看起来是一套东西 */
            --frost-bg: 0px;
            --tint: rgba(12, 15, 22, 0.42);
            --sheen: rgba(255, 255, 255, 0.08);
            --glow: rgba(255, 255, 255, 0.14);
            --hairline: rgba(255, 255, 255, 0.16);
            --edge-hi: rgba(255, 255, 255, 0.22);
            --edge-lo: rgba(0, 0, 0, 0.20);

            --card: rgba(255, 255, 255, 0.055);
            --card-hair: rgba(255, 255, 255, 0.09);
            --field: rgba(255, 255, 255, 0.08);
            --field-hair: rgba(255, 255, 255, 0.12);
            --field-hover: rgba(255, 255, 255, 0.15);

            --text: rgba(255, 255, 255, 0.95);
            --text-dim: rgba(255, 255, 255, 0.62);
            --text-faint: rgba(255, 255, 255, 0.40);
            --accent: #4facfe;
            --warn: #ffb020;
            --danger: #ff6b6b;
        }
        body.theme-light {
            --tint: rgba(248, 250, 253, 0.56);
            --sheen: rgba(255, 255, 255, 0.64);
            --glow: rgba(255, 255, 255, 0.74);
            --hairline: rgba(0, 0, 0, 0.10);
            --edge-hi: rgba(255, 255, 255, 0.96);
            --edge-lo: rgba(0, 0, 0, 0.08);

            --card: rgba(255, 255, 255, 0.60);
            --card-hair: rgba(0, 0, 0, 0.07);
            --field: rgba(0, 0, 0, 0.05);
            --field-hair: rgba(0, 0, 0, 0.08);
            --field-hover: rgba(0, 0, 0, 0.10);

            --text: #16181f;
            --text-dim: rgba(22, 24, 31, 0.62);
            --text-faint: rgba(22, 24, 31, 0.44);
            --warn: #b97700;
            --danger: #d14545;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: transparent !important;
            font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            color: var(--text);
            -webkit-app-region: no-drag;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            border-radius: var(--radius);
            background-color: #131720;
            background-size: cover;
            background-position: center;
            pointer-events: none;
            -webkit-app-region: no-drag;
        }
        #bg:not(.has-image) {
            background-image:
                radial-gradient(120% 100% at 18% 0%, #2b3553 0%, rgba(43, 53, 83, 0) 60%),
                radial-gradient(100% 95% at 92% 100%, #3d2b4e 0%, rgba(61, 43, 78, 0) 58%),
                linear-gradient(160deg, #151a24 0%, #1d2331 52%, #10131a 100%);
        }
        #bg.has-image { background-image: var(--bg-image); }
        body.theme-light #bg:not(.has-image) {
            background-image:
                radial-gradient(120% 100% at 18% 0%, #dfe7f5 0%, rgba(223, 231, 245, 0) 60%),
                radial-gradient(100% 95% at 92% 100%, #f0e4ee 0%, rgba(240, 228, 238, 0) 58%),
                linear-gradient(160deg, #eef1f7 0%, #e3e8f2 52%, #f5f6fa 100%);
        }

        #glass {
            position: fixed;
            inset: 0;
            z-index: 1;
            border-radius: var(--radius);
            overflow: hidden;
            pointer-events: none;
            -webkit-app-region: no-drag;
        }
        #frost {
            position: absolute;
            inset: 0;
            backdrop-filter: blur(var(--frost-bg));
            -webkit-backdrop-filter: blur(var(--frost-bg));
            background:
                linear-gradient(155deg, var(--sheen) 0%, rgba(255, 255, 255, 0) 46%),
                radial-gradient(120% 82% at 10% -14%, var(--glow), rgba(255, 255, 255, 0) 64%),
                var(--tint);
        }
        body.no-frost-bg #frost { backdrop-filter: none; -webkit-backdrop-filter: none; }
        #edge {
            position: fixed;
            inset: 0;
            z-index: 2;
            border-radius: var(--radius);
            border: 0.5px solid var(--hairline);
            box-shadow: inset 0 1px 0 var(--edge-hi), inset 0 -1px 0 var(--edge-lo);
            pointer-events: none;
            -webkit-app-region: no-drag;
        }

        .shell {
            position: relative;
            z-index: 3;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 18px 20px 14px;
        }

        /* ---------- 头部 ---------- */
        .hd {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            -webkit-app-region: drag;
            padding-bottom: 12px;
        }
        .hd .badge {
            width: 26px; height: 26px;
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 176, 32, 0.16);
            color: var(--warn);
            flex-shrink: 0;
        }
        .hd .badge svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .hd .titles { min-width: 0; }
        .hd .t { font-size: 14.5px; font-weight: 650; letter-spacing: 0.3px; }
        .hd .st { font-size: 11.5px; color: var(--text-faint); margin-top: 2px; }
        .hd .grow { flex: 1; }

        .icon-btn {
            width: 27px; height: 27px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: var(--field);
            border: 0.5px solid var(--field-hair);
            color: var(--text-dim);
            cursor: pointer;
            padding: 0;
            -webkit-app-region: no-drag;
            transition: background 0.18s, color 0.18s, transform 0.12s;
        }
        .icon-btn:hover { background: var(--field-hover); color: var(--text); }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .icon-btn.close:hover { color: var(--danger); background: rgba(255, 107, 107, 0.14); }

        /* ---------- 列表 ---------- */
        .list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 4px;
            -webkit-app-region: no-drag !important;
        }
        .list::-webkit-scrollbar { width: 5px; }
        .list::-webkit-scrollbar-track { background: transparent; }
        .list::-webkit-scrollbar-thumb { background: var(--field-hair); border-radius: 3px; }

        .item {
            background: var(--card);
            border: 0.5px solid var(--card-hair);
            border-radius: 14px;
            padding: 12px 14px;
            margin-bottom: 9px;
            position: relative;
        }
        .item::before {
            content: '';
            position: absolute;
            left: 0; top: 12px; bottom: 12px;
            width: 2.5px;
            border-radius: 2px;
            background: var(--danger);
            opacity: 0.85;
        }
        .item-hd {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 3px;
        }
        .item-name {
            font-size: 13px;
            font-weight: 650;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .chip {
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.4px;
            padding: 2px 7px;
            border-radius: 5px;
            background: rgba(255, 107, 107, 0.14);
            color: var(--danger);
            flex-shrink: 0;
        }
        .chip.neutral { background: var(--field); color: var(--text-faint); }

        .url-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 9px;
        }
        .url {
            font-family: 'Cascadia Mono', 'Consolas', monospace;
            font-size: 10.5px;
            color: var(--text-faint);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            flex: 1; min-width: 0;
            direction: rtl;
            text-align: left;
        }
        .copy {
            font-family: inherit;
            font-size: 10px;
            color: var(--text-faint);
            background: transparent;
            border: 0.5px solid var(--field-hair);
            border-radius: 6px;
            padding: 2px 7px;
            cursor: pointer;
            flex-shrink: 0;
            transition: color 0.16s, border-color 0.16s;
        }
        .copy:hover { color: var(--text); border-color: var(--text-faint); }
        .copy.done { color: #4fdf7f; border-color: rgba(79, 223, 127, 0.45); }

        .diag-title {
            font-size: 13.5px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text);
        }
        .diag-title::before {
            content: '';
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--danger);
            margin-right: 7px;
            vertical-align: 2px;
        }
        .detail {
            font-family: 'Cascadia Mono', 'Consolas', monospace;
            font-size: 10.5px;
            line-height: 1.6;
            color: var(--text-faint);
            background: rgba(0, 0, 0, 0.18);
            border-radius: 8px;
            padding: 6px 9px;
            margin-bottom: 8px;
            word-break: break-all;
            user-select: text;
        }
        body.theme-light .detail { background: rgba(0, 0, 0, 0.05); }

        .hint {
            display: flex;
            gap: 7px;
            font-size: 12px;
            line-height: 1.65;
            color: var(--text-dim);
        }
        .hint svg {
            width: 13px; height: 13px;
            flex-shrink: 0;
            margin-top: 2.5px;
            fill: none; stroke: var(--accent);
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
            opacity: 0.9;
        }

        /* ---------- 空/正常状态 ---------- */
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 100%;
            color: var(--text-dim);
            text-align: center;
        }
        .empty .ok {
            width: 44px; height: 44px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: rgba(79, 223, 127, 0.14);
            color: #4fdf7f;
        }
        .empty .ok svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
        .empty .t { font-size: 13px; }

        /* ---------- 底部 ---------- */
        .ft {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 11px;
            flex-shrink: 0;
            border-top: 0.5px solid var(--card-hair);
            margin-top: 4px;
        }
        .ft .note {
            font-size: 10.5px;
            color: var(--text-faint);
            flex: 1;
            line-height: 1.5;
            min-width: 0;
        }
        .btn {
            font-family: inherit;
            font-size: 12px;
            color: var(--text);
            background: var(--field);
            border: 0.5px solid var(--field-hair);
            border-radius: 9px;
            padding: 7px 13px;
            cursor: pointer;
            transition: background 0.18s, transform 0.12s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn:hover { background: var(--field-hover); }
        .btn:active { transform: scale(0.97); }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
        .btn.primary:hover { background: #3d95e8; }
        .btn.busy { opacity: 0.65; pointer-events: none; }

        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    </style>
</head>
<body class="theme-dark">
    <div id="bg"></div>
    <div id="glass"><div id="frost"></div></div>
    <div id="edge"></div>

    <div class="shell">
        <div class="hd">
            <div class="badge">
                <svg viewBox="0 0 24 24">
                    <path d="M12 9v4" />
                    <path d="M12 17h.01" />
                    <path d="M10.3 3.9 2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
                </svg>
            </div>
            <div class="titles">
                <div class="t">日历同步失败</div>
                <div class="st" id="summary">正在获取诊断信息…</div>
            </div>
            <div class="grow"></div>
            <button class="icon-btn close" id="closeBtn" title="关闭（Esc）">
                <svg viewBox="0 0 24 24">
                    <line x1="6" y1="6" x2="18" y2="18" />
                    <line x1="18" y1="6" x2="6" y2="18" />
                </svg>
            </button>
        </div>

        <div class="list" id="list"></div>

        <div class="ft">
            <div class="note" id="note">连续两次获取失败才会提示，偶发的网络抖动会自动恢复。</div>
            <button class="btn" id="settingsBtn">打开设置</button>
            <button class="btn primary" id="retryBtn">重新同步</button>
        </div>
    </div>

    <script>
        // manage-preload.js 注入：window.ipcRenderer / window.nodePath
        const ipc = window.ipcRenderer || { on: () => {}, send: () => {}, invoke: () => Promise.reject(new Error('no ipc')) };
        const $ = (id) => document.getElementById(id);
        const listEl = $('list');

        function esc(v) {
            return String(v == null ? '' : v)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function fmtTime(ts) {
            if (!ts) return '刚刚';
            const d = new Date(ts);
            return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        }

        // 背景与主题，和主面板 / 设置页共用同一套（背景图 + 色调 + 磨砂强度）
        function applyTheme(theme) {
            theme = theme === 'light' ? 'light' : 'dark';
            document.body.classList.remove('theme-dark', 'theme-light');
            document.body.classList.add(`theme-${theme}`);
        }

        function applyFrost(frost) {
            const bg = Math.max(0, Math.min(100, Number(frost && frost.bg) || 0));
            document.documentElement.style.setProperty('--frost-bg', (bg * 0.4).toFixed(1) + 'px');
            document.body.classList.toggle('no-frost-bg', bg <= 0);
        }

        let current = [];
        let totalLinks = 0;

        function render(errors, total, at) {
            current = Array.isArray(errors) ? errors : [];
            if (typeof total === 'number' && total > 0) totalLinks = total;
            // 这里不再按 count 过滤：只有"自动弹窗"才看连续失败次数，
            // 手动点「查看详情」就必须看到全部失败项（之前就是这样被过滤成"没问题"的）
            const bad = current.filter(Boolean);

            if (!bad.length) {
                $('summary').textContent = '所有日历目前都能正常获取';
                $('note').textContent = '如果刚才失败过，可能只是临时网络问题，已经自动恢复。';
                listEl.innerHTML = `
                    <div class="empty">
                        <div class="ok">
                            <svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5" /></svg>
                        </div>
                        <div class="t">现在没有需要处理的问题</div>
                    </div>`;
                return;
            }

            $('summary').textContent =
                `${totalLinks || current.length} 个日历中有 ${bad.length} 个获取失败 · 最近尝试 ${fmtTime(at)}`;
            $('note').textContent = '连续两次失败会自动弹出提醒；这里列出的是本次实际获取失败的日历。';

            listEl.innerHTML = bad.map(e => {
                const isLocal = e.type === 'local';
                const url = e.url || '';
                return `
                    <div class="item">
                        <div class="item-hd">
                            <div class="item-name" title="${esc(e.name)}">${esc(e.name)}</div>
                            <span class="chip ${e.count > 1 ? '' : 'neutral'}">${e.count > 1 ? `连续失败 ${e.count} 次` : '本次失败'}</span>
                            <span class="chip neutral">${isLocal ? '本地文件' : '网络订阅'}</span>
                        </div>
                        <div class="url-row">
                            <div class="url" title="${esc(url)}">${esc(url)}</div>
                            ${url ? `<button class="copy" data-url="${esc(url)}">复制</button>` : ''}
                        </div>
                        <div class="diag-title">${esc(e.title || '获取失败')}</div>
                        ${e.detail ? `<div class="detail">${esc(e.detail)}</div>` : ''}
                        <div class="hint">
                            <svg viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="9" />
                                <line x1="12" y1="11" x2="12" y2="16.5" />
                                <line x1="12" y1="7.6" x2="12" y2="7.61" />
                            </svg>
                            <span>${esc(e.hint || '检查网络后重试。')}</span>
                        </div>
                    </div>
                `;
            }).join('');

            listEl.querySelectorAll('.copy').forEach((btn) => {
                btn.addEventListener('click', async () => {
                    try {
                        await navigator.clipboard.writeText(btn.dataset.url);
                        btn.textContent = '已复制';
                        btn.classList.add('done');
                        setTimeout(() => {
                            if (!btn.isConnected) return;
                            btn.textContent = '复制';
                            btn.classList.remove('done');
                        }, 1500);
                    } catch {
                        btn.textContent = '复制失败';
                    }
                });
            });
        }

        ipc.on('sync-errors', (e, payload) => {
            const p = payload || {};
            render(p.errors, p.total, p.at);
        });

        // 重试完成后主进程会广播 link-errors-updated，顺手刷新列表
        ipc.on('link-errors-updated', (e, errors) => {
            render(Object.values(errors || {}), totalLinks, Date.now());
        });

        $('closeBtn').addEventListener('click', () => ipc.send('close-error-report'));
        $('retryBtn').addEventListener('click', () => {
            const btn = $('retryBtn');
            btn.classList.add('busy');
            btn.textContent = '正在同步…';
            ipc.send('retry-sync');
            setTimeout(() => {
                btn.classList.remove('busy');
                btn.textContent = '重新同步';
            }, 4000);
        });
        $('settingsBtn').addEventListener('click', () => {
            ipc.send('open-manage-links');
            ipc.send('close-error-report');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') ipc.send('close-error-report');
        });

        // 背景与主题
        ipc.on('theme-changed', (e, theme) => applyTheme(theme));
        ipc.on('frost-changed', (e, f) => applyFrost(f));
        ipc.on('bg-image-changed', (e, dataUrl) => {
            const bgEl = $('bg');
            if (dataUrl) {
                bgEl.classList.add('has-image');
                bgEl.style.setProperty('--bg-image', `url("${dataUrl}")`);
            } else {
                bgEl.classList.remove('has-image');
                bgEl.style.removeProperty('--bg-image');
            }
        });

        (async function init() {
            try {
                const [settings, bg] = await Promise.all([
                    ipc.invoke('get-settings').catch(() => null),
                    ipc.invoke('get-bg-image').catch(() => ''),
                ]);
                applyTheme((settings && settings.theme) || 'dark');
                applyFrost(settings && settings.frost);
                if (bg) {
                    const bgEl = $('bg');
                    bgEl.classList.add('has-image');
                    bgEl.style.setProperty('--bg-image', `url("${bg}")`);
                }
            } catch (e) { /* 用默认样式 */ }

            try {
                const data = await ipc.invoke('get-sync-errors');
                render(data.errors, data.total, data.at);
            } catch (e) {
                render([], 0, Date.now());
            }

            // 渲染完成后再让窗口出现（主进程另有 1.2s 兜底）
            requestAnimationFrame(() => requestAnimationFrame(() => ipc.send('report-ready')));
        })();
    </script>
</body>
</html>
